<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出席意願調查 | Alan & Omena</title>
    <!-- 精選字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Noto+Serif+TC:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            /* 法式溫暖奶茶色系 (Warm Milk Tea & Latte Palette) */
            --bg-body: #FAF7F2;
            --bg-card: #FFFFFF;
            --cream-soft: #F5EFE6;
            --milk-tea-light: #ECE2D5;
            --milk-tea-warm: #D9C3B0;
            --milk-tea-gold: #C5A059;
            --milk-tea-deep: #8E735B;
            --mocha-dark: #463426;
            --text-main: #3D2D20;
            --text-sub: #7A695B;
            --border-soft: #EFE6DC;
            --border-accent: #E0CFC0;

            --shadow-card: 0 12px 32px rgba(142, 115, 91, 0.08);
            --radius-card: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Noto Serif TC', serif, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.7;
            padding: 24px 16px 60px;
            min-height: 100vh;
        }

        .container {
            max-width: 580px;
            margin: 0 auto;
        }

        /* 頂部法式拱門卡片 */
        .hero-arch-card {
            background: var(--bg-card);
            border-radius: 120px 120px var(--radius-card) var(--radius-card);
            padding: 42px 24px 34px;
            text-align: center;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-soft);
            margin-bottom: 20px;
            position: relative;
        }

        .hero-arch-card::before {
            content: '';
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(197, 160, 89, 0.25);
            border-radius: 112px 112px 14px 14px;
            pointer-events: none;
        }

        .cursive-top {
            font-family: 'Alex Brush', cursive;
            font-size: 38px;
            color: var(--milk-tea-gold);
            line-height: 1.1;
            margin-bottom: 2px;
        }

        .names-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--milk-tea-deep);
            font-weight: 500;
            margin-bottom: 18px;
        }

        /* 似顏繪展示容器 */
        .illustration-box {
            width: 175px;
            height: 175px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #FFFDFB;
            border: 2px solid var(--milk-tea-warm);
            padding: 6px;
            box-shadow: 0 8px 24px rgba(142, 115, 91, 0.12);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .illustration-box svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .main-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--mocha-dark);
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .stage-badge {
            display: inline-block;
            background: var(--cream-soft);
            color: var(--milk-tea-deep);
            border: 1px solid var(--milk-tea-light);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .welcome-text {
            font-size: 13.5px;
            color: var(--text-sub);
            margin-bottom: 18px;
            line-height: 1.7;
        }

        /* 活動重要公告欄 */
        .info-pill-container {
            background: #FFFCF9;
            border: 1px dashed var(--milk-tea-warm);
            border-radius: 14px;
            padding: 14px 16px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-pill-item {
            display: flex;
            align-items: center;
            font-size: 13.5px;
            color: var(--text-main);
        }

        .info-pill-item i {
            color: var(--milk-tea-gold);
            margin-right: 8px;
            width: 16px;
            height: 16px;
        }

        .info-pill-item strong {
            color: var(--mocha-dark);
            margin-right: 6px;
        }

        /* 獨立分塊卡片 */
        .form-section-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 26px 22px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-soft);
            margin-bottom: 18px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--cream-soft);
        }

        .section-header i {
            color: var(--milk-tea-gold);
            width: 18px;
            height: 18px;
        }

        .section-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--mocha-dark);
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label.form-label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 7px;
        }

        .required::after {
            content: " *";
            color: #C07060;
        }

        .helper-tip {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-soft);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-main);
            background: #FFFCFA;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--milk-tea-deep);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }

        /* 典雅單選卡片按鈕 (Radio Cards) */
        .radio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .radio-card {
            position: relative;
            cursor: pointer;
            display: block;
            user-select: none;
        }

        .radio-card input[type="radio"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            margin: 0;
            z-index: 2;
        }

        .radio-tile {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 13px 8px;
            border: 1.5px solid var(--border-soft);
            border-radius: 12px;
            background: #FFFCFA;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
        }

        .radio-card input[type="radio"]:checked + .radio-tile {
            border-color: var(--milk-tea-deep);
            background: var(--cream-soft);
            color: var(--mocha-dark);
            font-weight: 600;
            box-shadow: 0 3px 10px rgba(142, 115, 91, 0.12);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* 提交按鈕 */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--milk-tea-deep), var(--mocha-dark));
            color: #FFFFFF;
            border: none;
            border-radius: 14px;
            font-size: 15.5px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 6px 18px rgba(70, 52, 38, 0.2);
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        /* 彈出提示 Modal */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(61, 45, 32, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .modal-window {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 32px 24px 26px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--border-soft);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.15);
        }

        .modal-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--cream-soft);
            color: var(--milk-tea-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .modal-title {
            font-size: 19px;
            font-weight: 600;
            color: var(--mocha-dark);
            margin-bottom: 8px;
        }

        .modal-text {
            font-size: 13.5px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .modal-close-btn {
            width: 100%;
            padding: 12px;
            background: var(--milk-tea-deep);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部卡片 -->
    <header class="hero-arch-card">
        <div class="cursive-top">We're Married</div>
        <div class="names-subtitle">Alan & Omena</div>
        
        <!-- 似顏繪向量原圖 -->
        <div class="illustration-box">
            <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M 0 0 L 400 0 L 400 400 L 0 400 Z" fill="#FAF6F0"/>
                <g stroke="#2C241E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
                    <!-- 新郎西裝輪廓 -->
                    <path d="M 235 390 L 255 245 C 265 210 295 190 325 185 L 355 230 C 370 255 375 330 380 390" />
                    <path d="M 255 245 L 290 260 L 315 210" />
                    <path d="M 290 260 L 285 390" />
                    <!-- 領結 -->
                    <path d="M 250 205 C 242 198 238 215 246 220 Z" fill="#2C241E" />
                    <path d="M 264 205 C 272 198 276 215 268 220 Z" fill="#2C241E" />
                    <ellipse cx="257" cy="212" rx="3" ry="4" fill="#2C241E" />
                    <path d="M 250 220 L 258 245 L 268 220" />
                    <!-- 新郎面部與頭髮 -->
                    <path d="M 250 195 L 246 170 C 246 160 252 148 248 140 C 245 136 238 135 234 135 C 230 137 225 137 222 142 C 220 146 222 152 225 154 L 220 156 C 215 158 216 168 221 168 C 228 168 230 178 238 185 C 244 190 248 198 250 205" />
                    <path d="M 221 154 C 224 153 226 153 228 155" />
                    <path d="M 223 140 C 227 137 232 138 234 140" />
                    <path d="M 252 170 C 260 170 262 178 260 188 C 258 195 253 200 248 200" />
                    <path d="M 218 132 C 215 125 210 115 205 110 C 200 105 195 102 190 108 C 188 112 186 118 184 122" />
                    <path d="M 190 105 C 196 95 204 88 212 80 C 220 72 230 65 242 62 C 255 58 268 62 278 70 C 286 78 290 88 292 98 C 294 108 288 118 288 128 C 288 135 284 140 280 145" />
                    <path d="M 242 65 C 240 75 238 85 236 95 M 255 68 C 252 80 250 92 248 102 M 268 75 C 265 88 262 98 260 110" />
                    
                    <!-- 新娘面部與髮型 -->
                    <path d="M 213 145 C 210 142 205 140 200 144 C 196 148 202 153 207 153 C 212 153 214 156 211 158 C 205 162 195 163 192 168 C 188 174 192 182 195 188 C 198 195 204 200 208 208" />
                    <path d="M 203 147 C 200 147 198 148 196 150" />
                    <path d="M 204 135 C 198 134 194 136 190 138" />
                    <path d="M 192 168 C 178 185 165 215 158 245 C 150 275 148 310 145 350" />
                    <path d="M 175 125 C 170 135 168 150 162 162 C 155 178 145 195 138 212 C 130 230 128 250 128 270 C 128 290 132 310 128 330 C 125 345 115 365 105 385" />
                    <path d="M 188 118 C 182 108 175 102 168 98 C 155 92 142 95 132 102 C 120 112 115 125 110 138 C 102 158 98 180 92 202" />
                    <path d="M 180 110 C 178 120 178 130 175 140 M 168 112 C 165 125 162 138 160 150" />
                    <!-- 新娘禮服與背紗 -->
                    <path d="M 158 245 C 145 255 135 258 122 260 C 115 262 110 260 108 268 C 102 290 105 320 115 350 L 125 390" />
                    <path d="M 108 268 C 95 285 70 340 55 390" />
                    <path d="M 102 148 C 85 180 68 220 52 270 C 40 310 32 350 25 390" stroke-width="1.8" stroke-dasharray="4 2" />
                </g>
            </svg>
        </div>

        <h1 class="main-title">出席意願調查</h1>
        
        
        <p class="welcome-text">
            誠摯邀請最親近的家人與摯友，與我們一同慶祝！<br>
            目前正進行出席意願統計以利場地安排，<br>
            確定後將發送詳細通知給您。
        </p>

        <!-- 活動資訊卡片 -->
        <div class="info-pill-container">
            <div class="info-pill-item">
                <i data-lucide="calendar"></i>
                <div><strong>日期：</strong>預計 2027 年 03/06 或 03/13（週六）</div>
            </div>
            <div class="info-pill-item">
                <i data-lucide="map-pin"></i>
                <div><strong>地點：</strong>台北</div>
            </div>
        </div>
    </header>

    <!-- 表單開始 -->
    <form id="rsvpPhase1Form">
        <!-- 區塊一：基本資料 -->
        <div class="form-section-card">
            <div class="section-header">
                <i data-lucide="user"></i>
                <h3>基本資料</h3>
            </div>

            <div class="form-group">
                <label for="guestName" class="form-label required">您的姓名</label>
                <input type="text" id="guestName" required>
            </div>

            <div class="form-group">
                <label class="form-label required">您是哪一方的親友？</label>
                <div class="radio-grid">
                    <label class="radio-card" for="sideGroom">
                        <input type="radio" name="side" value="男方親友" id="sideGroom" required checked>
                        <div class="radio-tile">
                            <span>🤵 男方親友</span>
                        </div>
                    </label>
                    <label class="radio-card" for="sideBride">
                        <input type="radio" name="side" value="女方親友" id="sideBride">
                        <div class="radio-tile">
                            <span>👰 女方親友</span>
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <!-- 區塊二：出席意願 -->
        <div class="form-section-card">
            <div class="section-header">
                <i data-lucide="check-circle-2"></i>
                <h3>出席意願</h3>
            </div>

            <div class="form-group">
                <label class="form-label required">是否能來參加？</label>
                <div class="radio-grid">
                    <label class="radio-card" for="attendYes">
                        <input type="radio" name="attendance" value="yes" id="attendYes" checked onchange="handleAttendanceChange(true)">
                        <div class="radio-tile">
                            <span>Yes</span>
                        </div>
                    </label>
                    <label class="radio-card" for="attendNo">
                        <input type="radio" name="attendance" value="no" id="attendNo" onchange="handleAttendanceChange(false)">
                        <div class="radio-tile">
                            <span>No</span>
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <!-- 出席專屬區塊：聯絡資訊、日期偏好與人數（若選擇 Yes 才顯示） -->
        <div id="attendingDetailsSection">
            <!-- 聯絡資訊 -->
            <div class="form-section-card">
                <div class="section-header">
                    <i data-lucide="mail"></i>
                    <h3>聯絡方式</h3>
                </div>
                <div class="form-group grid-2">
                    <div>
                        <label for="guestEmail" class="form-label required">聯絡 Email</label>
                        <input type="email" id="guestEmail" required>
                        <div class="helper-tip">後續詳細通知將優先寄送至此信箱</div>
                    </div>
                    <div>
                        <label for="guestPhone" class="form-label required">聯絡電話</label>
                        <input type="tel" id="guestPhone" required>
                    </div>
                </div>
            </div>

            <!-- 日期偏好與人數統計 -->
            <div class="form-section-card">
                <div class="section-header">
                    <i data-lucide="users"></i>
                    <h3>日期與人數</h3>
                </div>

                <div class="form-group">
                    <label for="datePreference" class="form-label required">目前規劃的日期，哪一天比較方便？</label>
                    <select id="datePreference">
                        <option value="兩天都可以"> 3/06 與 3/13 都可以</option>
                        <option value=" 3/06 (六) "> 3/06（週六）</option>
                        <option value=" 3/13 (六) "> 3/13（週六）</option>
                    </select>
                </div>

                <div class="form-group grid-2">
                    <div>
                        <label for="adultCount" class="form-label required">大人人數（含自己）</label>
                        <select id="adultCount">
                            <option value="1">1 位</option>
                            <option value="2">2 位</option>
                            <option value="3">3 位</option>
                            <option value="4">4 位</option>
                            <option value="5">5 位</option>
                            <option value="6">6 位</option>
                            <option value="7">7 位</option>
                            <option value="8">8 位</option>
                            <option value="9">9 位</option>
                            <option value="10">10 位</option>
                        </select>
                    </div>
                    <div>
                        <label for="childCount" class="form-label">幼童人數</label>
                        <select id="childCount">
                            <option value="0">0 位</option>
                            <option value="1">1 位幼童</option>
                            <option value="2">2 位幼童</option>
                            <option value="3">3 位幼童</option>
                            <option value="4">4 位幼童</option>
                            <option value="5">5 位幼童</option>
                            <option value="6">6 位幼童</option>
                            <option value="7">7 位幼童</option>
                            <option value="8">8 位幼童</option>
                            <option value="9">9 位幼童</option>
                            <option value="10">10 位幼童</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 區塊：想說的話 -->
        <div class="form-section-card">
            <div class="section-header">
                <i data-lucide="message-heart"></i>
                <h3>想說的話</h3>
            </div>

            <div class="form-group">
                <label for="guestMessage" class="form-label">給新人的話</label>
                <textarea id="guestMessage" rows="3"></textarea>
            </div>
        </div>

        <!-- 提交按鈕 -->
        <button type="submit" class="btn-submit">
            <i data-lucide="send" style="width: 17px; height: 17px;"></i>
            送出出席意願
        </button>
    </form>
</div>

<!-- 提交成功彈窗 -->
<div class="modal-mask" id="successModal">
    <div class="modal-window">
        <div class="modal-icon">
            <i data-lucide="heart" style="width: 26px; height: 26px;"></i>
        </div>
        <h3 class="modal-title">感謝您的回覆！</h3>
        <p class="modal-text" id="modalDesc">
            我們已收到您的初步意願！<br>
            待日期敲定後，我們將透過 Email 發送詳細資訊。
        </p>
        <button class="modal-close-btn" onclick="closeModal()">好的</button>
    </div>
</div>

<script>
    lucide.createIcons();

    const STORAGE_KEY = 'wedding_20270306_rsvp_data';
    let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    function handleAttendanceChange(isYes) {
        const detailsSection = document.getElementById('attendingDetailsSection');
        const emailInput = document.getElementById('guestEmail');
        const phoneInput = document.getElementById('guestPhone');

        if (isYes) {
            detailsSection.style.display = 'block';
            emailInput.setAttribute('required', '');
            phoneInput.setAttribute('required', '');
        } else {
            detailsSection.style.display = 'none';
            emailInput.removeAttribute('required');
            phoneInput.removeAttribute('required');
            emailInput.value = '';
            phoneInput.value = '';
        }
    }

    document.getElementById('rsvpPhase1Form').addEventListener('submit', function(e) {
        e.preventDefault();

        const attendance = document.querySelector('input[name="attendance"]:checked').value;
        const isYes = attendance === 'yes';

        const entry = {
            name: document.getElementById('guestName').value.trim(),
            side: document.querySelector('input[name="side"]:checked').value,
            email: isYes ? document.getElementById('guestEmail').value.trim() : '無',
            phone: isYes ? document.getElementById('guestPhone').value.trim() : '無',
            attendance: attendance,
            datePreference: isYes ? document.getElementById('datePreference').value : '無',
            adultCount: isYes ? parseInt(document.getElementById('adultCount').value) : 0,
            childCount: isYes ? parseInt(document.getElementById('childCount').value) : 0,
            message: document.getElementById('guestMessage').value.trim(),
            stage: "phase_1",
            time: new Date().toLocaleString('zh-TW', { hour12: false })
        };

        records.unshift(entry);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));

        // 彈出提示
        const modalDesc = document.getElementById('modalDesc');
        if (!isYes) {
            modalDesc.innerHTML = "感謝您的暖心祝福！<br>雖然這次無法前來，這份心意我們都好好收下囉 ❤️";
        } else {
            modalDesc.innerHTML = "我們已收到您的初步出席意願！<br>待最終日期敲定後，我們會寄送詳細資訊給您。";
        }
        document.getElementById('successModal').style.display = 'flex';

        this.reset();
        document.getElementById('sideGroom').checked = true;
        document.getElementById('attendYes').checked = true;
        handleAttendanceChange(true);
        lucide.createIcons();
    });

    function closeModal() {
        document.getElementById('successModal').style.display = 'none';
    }
</script>

</body>
</html>
